<style>
:root{
  --bg:#f6f5f3; --surface:#ffffff; --surface-2:#faf9f7;
  --ink:#1a1714; --muted:#74706a; --faint:#a8a39b;
  --border:#e7e4df; --hairline:#efedea;
  --topbar:#16130f;
  --accent:#8a2d5a; --accent-tint:#f7e9f0;
  --crit:#c0392b; --crit-tint:#fbeae7;
  --warn:#b46a09; --warn-tint:#fbf1e0;
  --good:#2f7d52; --good-tint:#e6f2ea;
  --cap:#3f51b5; --cap-tint:#eaecf8;
  --r-lg:12px; --r-md:9px; --r-sm:6px;
  --sh:0 1px 2px rgba(20,16,12,.05), 0 1px 1px rgba(20,16,12,.03);
  --sh-pop:0 10px 30px rgba(20,16,12,.13), 0 2px 8px rgba(20,16,12,.08);
  --sans:'Schibsted Grotesk',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;}
#root{min-height:100vh;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;}
::selection{background:var(--accent-tint);}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
.sidebar{position:sticky;top:0;height:100vh;background:var(--topbar);color:#e9e5df;display:flex;flex-direction:column;padding:0;}
.brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand .mark{display:flex;align-items:center;gap:10px;}
.brand .glyph{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#bd5a89);display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
.brand .glyph svg{width:15px;height:15px;}
.brand .name{font-weight:700;font-size:14.5px;letter-spacing:-.01em;color:#fff;line-height:1.1;}
.brand .sub{font-size:11px;color:#9a948b;letter-spacing:.02em;margin-top:1px;}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7e7870;padding:8px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:#cbc6bf;font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background .12s,color .12s;position:relative;}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:#fff;color:var(--ink);font-weight:600;}
.nav-item.active svg{opacity:1;}
.nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--crit);color:#fff;}
.nav-item.active .badge{background:var(--crit-tint);color:var(--crit);}
.sidebar-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8c867d;line-height:1.5;}

.main{min-width:0;display:flex;flex-direction:column;}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,245,243,.86);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;}
.topbar h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em;}
.topbar .crumb{font-size:12px;color:var(--muted);margin-bottom:3px;letter-spacing:.01em;}
.topbar .meta{display:flex;align-items:center;gap:18px;font-size:12px;color:var(--muted);}
.topbar .meta .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-tint);display:inline-block;margin-right:6px;vertical-align:middle;}
.content{padding:26px 32px 64px;max-width:1280px;width:100%;}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);}
.card-pad{padding:18px 20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;border-bottom:1px solid var(--hairline);}
.card-head h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.01em;}
.card-head .hint{font-size:11.5px;color:var(--muted);}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;line-height:1.5;white-space:nowrap;}
.pill svg{width:11px;height:11px;}
.pill.crit{background:var(--crit-tint);color:var(--crit);}
.pill.warn{background:var(--warn-tint);color:var(--warn);}
.pill.good{background:var(--good-tint);color:var(--good);}
.pill.cap{background:var(--cap-tint);color:var(--cap);}
.pill.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--border);}
.pill.ink{background:var(--ink);color:#fff;}

.dotmark{width:8px;height:8px;border-radius:50%;flex:none;}

.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);transition:background .12s,border-color .12s;}
.btn:hover{background:var(--surface-2);border-color:#d8d4ce;}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.btn.primary:hover{background:#2c2620;}
.btn svg{width:15px;height:15px;}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .12s;}
.tag:hover{border-color:#d2cdc6;color:var(--ink);}
.tag.on{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px;}
.kpi .value{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:9px;line-height:1;}
.kpi .value .unit{font-size:13px;color:var(--faint);font-weight:500;margin-left:4px;}
.kpi .sub{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;}
.kpi .accent-edge{position:absolute;left:0;top:0;bottom:0;width:3px;}
.kpi-btn{text-align:left;width:100%;font-family:inherit;cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .08s;}
.kpi-btn:hover{border-color:#d2cdc6;box-shadow:var(--sh-pop);}
.kpi-btn:active{transform:translateY(1px);}
.kpi-cta{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);margin-top:11px;opacity:0;transform:translateY(2px);transition:opacity .14s,transform .14s;}
.kpi-btn:hover .kpi-cta{opacity:1;transform:none;}
.kpi-cta svg{flex:none;}

/* ---------- Bars ---------- */
.bar-track{position:relative;height:8px;border-radius:999px;background:var(--hairline);overflow:hidden;}
.bar-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;}
.metric-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}

/* ---------- Predictor specific ---------- */
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden;}
.match-card .mc-head{display:flex;align-items:flex-start;gap:14px;padding:16px 20px 14px;}
.opposed{display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;gap:0;margin:6px 0;}
.opposed .side{display:flex;flex-direction:column;}
.ladder{display:flex;flex-direction:column;gap:7px;}
.ladder-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;font-size:12.5px;}
.ladder-row .lname{display:flex;align-items:center;gap:8px;color:var(--ink);min-width:0;}
.ladder-row .lname .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.comp-bar{height:22px;border-radius:5px;background:var(--surface-2);border:1px solid var(--hairline);position:relative;overflow:hidden;}
.comp-bar .cfill{position:absolute;left:0;top:0;bottom:0;}

/* ---------- Table ---------- */
.tbl-wrap{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;font-size:13px;}
table.data th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none;}
table.data th.num{text-align:right;}
table.data th:hover{color:var(--ink);}
table.data th .arr{opacity:.5;margin-left:3px;font-size:9px;}
table.data td{padding:11px 14px;border-bottom:1px solid var(--hairline);vertical-align:middle;}
table.data td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
table.data tr.row:hover{background:var(--surface-2);cursor:pointer;}
table.data .sku-cell{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);}
table.data .name-cell{font-weight:500;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;flex:1;max-width:340px;}
.search input{border:none;outline:none;background:none;flex:1;font-size:13.5px;color:var(--ink);}
.search svg{width:16px;height:16px;color:var(--faint);}

/* ---------- Slide-over ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,16,12,.32);backdrop-filter:blur(1px);z-index:60;}
.slideover{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--surface);z-index:61;box-shadow:var(--sh-pop);display:flex;flex-direction:column;animation:slidein .22s cubic-bezier(.2,.7,.3,1);}
@keyframes slidein{from{transform:translateX(28px);}to{transform:none;}}

/* ---------- Awaiting data ---------- */
.awaiting{position:relative;border:1.5px dashed #d6d1c9;border-radius:var(--r-lg);background:repeating-linear-gradient(135deg,transparent,transparent 9px,rgba(138,45,90,.035) 9px,rgba(138,45,90,.035) 18px);}
.await-tag{position:absolute;top:12px;right:12px;}

.channel-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh);position:relative;}

.flag-item{display:flex;gap:13px;padding:13px 18px;border-bottom:1px solid var(--hairline);align-items:flex-start;transition:background .12s;cursor:pointer;}
.flag-item:last-child{border-bottom:none;}
.flag-item:hover{background:var(--surface-2);}
.flag-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none;}
.flag-ic svg{width:16px;height:16px;}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
.seg button{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:6px;color:var(--muted);transition:all .12s;}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh);}

.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px;}
.section-title h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;}
.section-title .line{flex:1;height:1px;background:var(--border);}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}

.fade-in{animation:fadeUp .3s ease;}
@keyframes fadeUp{from{transform:translateY(6px);}to{transform:none;}}

/* ---------- Gantt ---------- */
.gantt{position:relative;}
.gantt-grid{position:absolute;inset:0;pointer-events:none;}
.gantt-grid .gl{position:absolute;top:0;bottom:0;width:1px;background:var(--hairline);}
.gantt-grid .gl.month{background:#e2ded8;}
.grow{display:grid;grid-template-columns:210px 1fr;align-items:center;min-height:34px;position:relative;}
.grow .glabel{font-size:12px;display:flex;align-items:center;gap:8px;padding-right:14px;min-width:0;}
.grow .glabel .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gtrack{position:relative;height:34px;}
.gbar{position:absolute;top:7px;height:20px;border-radius:5px;display:flex;align-items:center;padding:0 8px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;box-shadow:var(--sh);}
.gbar.overdue{outline:2px solid var(--crit);outline-offset:1px;}
.gmark{position:absolute;top:-4px;bottom:-4px;width:0;z-index:5;}
.gmark .lab{position:absolute;top:-16px;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap;background:var(--surface);padding:0 4px;border-radius:3px;}
.gphase-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:10px 0 4px;grid-column:1 / -1;}

/* ---------- Product Development ---------- */
.pd-board{display:grid;grid-template-columns:repeat(6,minmax(150px,1fr));gap:12px;overflow-x:auto;}
.pd-col{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);min-width:150px;display:flex;flex-direction:column;}
.pd-col-head{display:flex;align-items:center;gap:7px;padding:11px 13px;font-size:12px;font-weight:700;border-bottom:1px solid var(--hairline);}
.pd-col-head .pd-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 7px;}
.pd-col-body{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:80px;}
.pd-empty{text-align:center;color:var(--faint);font-size:13px;padding:14px 0;}
.pd-card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 12px;box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s,transform .08s;}
.pd-card:hover{border-color:#d2cdc6;box-shadow:var(--sh-pop);transform:translateY(-1px);}
.pd-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(480px,94vw);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-pop);z-index:61;padding:22px 24px;}
.pd-input{width:100%;font-size:13.5px;padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);outline:none;}
.pd-input:focus{border-color:var(--accent);}
.pd-wt{width:64px;font-family:var(--mono);font-size:12.5px;text-align:right;padding:4px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink);outline:none;}
.pd-wt:focus{border-color:var(--accent);background:#fff;}

@media(max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
